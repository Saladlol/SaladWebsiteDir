<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TheSaladAppears | Work</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav>

            <h1>TheSaladAppears</h1>

            <div>
                <a href="home.html">Home</a>
                <a href="works.html">Work</a>
                <a href="home.html#about">About</a>
                <a href="home.html#contact">Contact</a>
            </div>

        </nav>

    </header>


    <main class="work-page">

        <section>

            <p class="small-text">PORTFOLIO</p>

            <h2>My Work</h2>


            <!-- work filters -->

            <div class="work-filters">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="animation"
                >
                    Animation
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="game-dev"
                >
                    Game Dev
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="music"
                >
                    Music
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="build"
                >
                    Building
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="art"
                >
                    Art
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="video-editing"
                >
                    Video Editing
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="rendering"
                >
                    Rendering
                </button>

            </div>


            <!-- gallery -->

            <div class="gallery">


                <!-- video -->

                <div
                    class="gallery-item"
                    data-type="video"
                    data-title="Short stylised stun animation showcase"
                    data-description="An animation I created to showcase the stun animation for a character."
                    data-src="media/Videos/Roaring Salad.mp4"
                    data-tags="animation,video-editing"
                >

                    <video
                        src="media/Videos/Roaring Salad.mp4"
                        muted
                        loop
                        playsinline
                        preload="metadata"
                    ></video>

                    <div class="gallery-title">

                        <span>
                            Stylised stun animation showcase
                        </span>

                        <span>
                            VIDEO
                        </span>

                    </div>

                </div>


                <!-- music -->

                <div
                    class="gallery-item music-item"
                    data-type="audio"
                    data-title="Circus: Salad remix"
                    data-description="This is a remix of 'Circus (Sigma Rizz Mode Final Arc Ultra Edition)' by silvagunner."
                    data-src="media/music/circusRemixSalad.ogg"
                    data-tags="music"
                >

                    <div class="music-preview">

                        <div class="music-play">
                            ▶
                        </div>

                        <div class="music-info">

                            <span class="music-name">
                                Circus: Salad remix
                            </span>

                            <span class="music-description">
                                remix
                            </span>

                        </div>

                        <span class="music-type">
                            MUSIC
                        </span>

                    </div>

                </div>


                <!-- image -->

                <div
                    class="gallery-item"
                    data-type="image"
                    data-title="Pixel art 'Temmie' character"
                    data-description="A pixel art version of my character taking the appearance of 'Temmie' from Undertale."
                    data-src="media/Images/SaladTemmie.png"
                    data-tags="art"
                >

                    <img
                        src="media/Images/SaladTemmie.png"
                        alt="Salad Temmie pixel art"
                    >

                    <div class="gallery-title">

                        <span>
                            Salad Temmie pixel art
                        </span>

                        <span>
                            IMAGE
                        </span>

                    </div>

                </div>


                <!-- photo set -->

                <div
                    class="gallery-item photo-set"
                    data-type="photo-set"
                    data-title="Renders of my character in backrooms scenes"
                    data-description="Here's a couple renders of my character. Drawings by ShiroMiso."
                    data-images='[
                        "media/Images/LarpingRoomsRenders/BigRoom.png",
                        "media/Images/LarpingRoomsRenders/Hallway.png",
                        "media/Images/LarpingRoomsRenders/MovieRoom.png",
                        "media/Images/LarpingRoomsRenders/Poolroom.png"
                    ]'
                    data-tags="build,rendering"
                >

                    <div class="set-preview">

                        <img
                            src="media/Images/LarpingRoomsRenders/BigRoom.png"
                            alt="Backrooms room render"
                        >

                    </div>

                    <div class="gallery-title">

                        <span>
                            Blender building and rendering
                        </span>

                        <span>
                            4 IMAGES
                        </span>

                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- lightbox -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            type="button"
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close"
        >
            ×
        </button>


        <button
            type="button"
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev"
            aria-label="Previous image"
        >
            ←
        </button>


        <div class="lightbox-inner">

            <div
                class="lightbox-content"
                id="lightboxContent"
            ></div>


            <div
                class="lightbox-description"
                id="lightboxDescription"
            ></div>

        </div>


        <button
            type="button"
            class="lightbox-arrow lightbox-next"
            id="lightboxNext"
            aria-label="Next image"
        >
            →
        </button>


        <div
            class="lightbox-counter"
            id="lightboxCounter"
        >
            1 / 1
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
